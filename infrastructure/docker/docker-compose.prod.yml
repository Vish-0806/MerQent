# MerQent — Production-Grade Local Orchestration Compose Configuration
# Orchestrates PostgreSQL 16 (pgvector), Redis, MinIO, NestJS API, and Next.js Web

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: merqent_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-merqent_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-merqent_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-merqent_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-merqent_user} -d ${POSTGRES_DB:-merqent_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - merqent-internal

  redis:
    image: redis:7.2-alpine
    container_name: merqent_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - merqent-internal

  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: merqent_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_ACCESS_KEY:-minioadmin}
    ports:
      - "${STORAGE_PORT:-9000}:9000"
      - "${STORAGE_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "/usr/bin/mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - merqent-internal

  minio-init:
    image: cgr.dev/chainguard/minio:latest
    container_name: merqent_minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD};
      /usr/bin/mc mb --ignore-existing local/$${STORAGE_BUCKET_NAME};
      echo 'Bucket verification complete';
      exit 0;
      "
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_ACCESS_KEY:-minioadmin}
      STORAGE_BUCKET_NAME: ${STORAGE_BUCKET_NAME:-merqent-secure-documents}
    restart: "no"
    networks:
      - merqent-internal

  clamav:
    image: clamav/clamav:stable
    container_name: merqent_clamav
    restart: unless-stopped
    environment:
      CLAMAV_NO_FRESHCLAM: "true"
    ports:
      - "${CLAMAV_PORT:-3310}:3310"
    healthcheck:
      test: ["CMD-SHELL", "clamdscan --ping 5 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - merqent-internal

  api:
    build:
      context: ../../
      dockerfile: infrastructure/docker/Dockerfile.api
    image: merqent-api:latest
    container_name: merqent_api
    restart: unless-stopped
    ports:
      - "${PORT:-4000}:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-merqent_user}:${POSTGRES_PASSWORD:-merqent_dev_password}@postgres:5432/${POSTGRES_DB:-merqent_db}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      STORAGE_DRIVER: s3
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_REGION: ${STORAGE_REGION:-us-east-1}
      STORAGE_BUCKET_NAME: ${STORAGE_BUCKET_NAME:-merqent-secure-documents}
      STORAGE_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY_ID:-minioadmin}
      STORAGE_SECRET_ACCESS_KEY: ${STORAGE_SECRET_ACCESS_KEY:-minioadmin}
      STORAGE_SIGNED_URL_EXPIRY_SECONDS: ${STORAGE_SIGNED_URL_EXPIRY_SECONDS:-900}
      MALWARE_SCANNER_ENABLED: ${MALWARE_SCANNER_ENABLED:-true}
      CLAMAV_HOST: clamav
      CLAMAV_PORT: 3310
      CLAMAV_TIMEOUT_MS: 10000
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-localhost}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      WEB_APP_URL: ${WEB_APP_URL:-http://localhost:3000}
      API_BASE_URL: ${API_BASE_URL:-http://localhost:4000/api/v1}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      clamav:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:4000/api/v1/health', (r) => { if (r.statusCode !== 200) process.exit(1); })"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - merqent-internal

  web:
    build:
      context: ../../
      dockerfile: infrastructure/docker/Dockerfile.web
    image: merqent-web:latest
    container_name: merqent_web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_TELEMETRY_DISABLED: 1
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000/api/v1}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-MerQent}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000', (r) => { if (r.statusCode >= 500) process.exit(1); })"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - merqent-internal

networks:
  merqent-internal:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data:
