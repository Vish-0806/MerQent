name: MerQent CD — Continuous Deployment Readiness Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      confirm_production_deploy:
        description: 'Type DEPLOY-PROD to confirm production rollout'
        required: false
        default: ''
        type: string

concurrency:
  group: cd-${{ inputs.environment || 'staging' }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # Required for AWS IAM OIDC federation when provisioned

jobs:
  validate-deployment-readiness:
    name: Validate Deployment Prerequisites
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      has_aws_creds: ${{ steps.check_creds.outputs.has_aws_creds }}
      target_env: ${{ steps.set_env.outputs.target_env }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Determine Target Environment
        id: set_env
        run: |
          TARGET="${{ inputs.environment || 'staging' }}"
          echo "target_env=$TARGET" >> "$GITHUB_OUTPUT"
          echo "Selected Target Environment: $TARGET"

      - name: Validate Production Confirmation
        if: ${{ steps.set_env.outputs.target_env == 'production' }}
        run: |
          if [ "${{ inputs.confirm_production_deploy }}" != "DEPLOY-PROD" ]; then
            echo "❌ Error: Production deployment requires explicit confirmation."
            echo "   Pass 'confirm_production_deploy: DEPLOY-PROD' to proceed."
            exit 1
          fi
          echo "✔ Production rollout confirmation verified."

      - name: Assess Cloud Credentials & Environment
        id: check_creds
        env:
          AWS_ROLE_TO_ASSUME: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_ECR_REGISTRY: ${{ secrets.AWS_ECR_REGISTRY }}
          DEPLOY_ENV: ${{ steps.set_env.outputs.target_env }}
        run: |
          node scripts/deployment/verify-deployment-readiness.js
          if [ -n "${AWS_ROLE_TO_ASSUME}" ] || [ -n "${AWS_ACCESS_KEY_ID}" ]; then
            echo "has_aws_creds=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_aws_creds=false" >> "$GITHUB_OUTPUT"
          fi

  build-immutable-images:
    name: Build Immutable Container Images
    needs: [validate-deployment-readiness]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build MerQent API Image (Immutable SHA Tag)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infrastructure/docker/Dockerfile.api
          push: false
          tags: |
            merqent-api:${{ github.sha }}
            merqent-api:${{ needs.validate-deployment-readiness.outputs.target_env }}

      - name: Build MerQent Web Image (Immutable SHA Tag)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infrastructure/docker/Dockerfile.web
          push: false
          tags: |
            merqent-web:${{ github.sha }}
            merqent-web:${{ needs.validate-deployment-readiness.outputs.target_env }}

  deploy-staging:
    name: Staging Rollout
    needs: [validate-deployment-readiness, build-immutable-images]
    if: ${{ needs.validate-deployment-readiness.outputs.target_env == 'staging' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    steps:
      - name: Execute Staging Deployment / Readiness Report
        run: |
          echo "============================================================"
          echo "🚀 MerQent Staging Deployment Pipeline"
          echo "Commit SHA: ${{ github.sha }}"
          echo "Tag:        merqent-api:${{ github.sha }}"
          echo "============================================================"
          if [ "${{ needs.validate-deployment-readiness.outputs.has_aws_creds }}" == "true" ]; then
            echo "Pushing images to ECR and updating ECS staging service..."
            # aws ecs update-service --cluster merqent-staging --service merqent-api --force-new-deployment
          else
            echo "ℹ️  Container images validated. Cloud deployment credentials pending in GitHub Secrets."
            echo "   To enable automated AWS deployment, configure AWS_ROLE_TO_ASSUME and AWS_ECR_REGISTRY."
          fi

  deploy-production:
    name: Production Rollout (Manual Gate)
    needs: [validate-deployment-readiness, build-immutable-images]
    if: ${{ needs.validate-deployment-readiness.outputs.target_env == 'production' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - name: Execute Production Deployment
        run: |
          echo "============================================================"
          echo "🔒 MerQent Production Deployment Pipeline (Protected Gate)"
          echo "Commit SHA: ${{ github.sha }}"
          echo "Tag:        merqent-api:${{ github.sha }}"
          echo "============================================================"
          if [ "${{ needs.validate-deployment-readiness.outputs.has_aws_creds }}" == "true" ]; then
            echo "Pushing images to ECR and performing zero-downtime rolling update on ECS..."
            # aws ecs update-service --cluster merqent-prod --service merqent-api --force-new-deployment
          else
            echo "ℹ️  Container images validated. Production cloud credentials pending in GitHub Secrets."
            echo "   To enable automated AWS deployment, configure AWS_ROLE_TO_ASSUME and AWS_ECR_REGISTRY."
          fi
